name: Publicar sitio

on:
  push:
    branches: [main]
  workflow_dispatch:

# Por defecto ningún trabajo puede escribir; cada uno pide solo lo que necesita.
permissions:
  contents: read

# Una publicación a la vez; no se cancela una que ya está en curso.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # Compila el sitio y sube el paquete para GitHub Pages.
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          VITE_NEWS_URL: ${{ vars.VITE_NEWS_URL }}
          VITE_ALERTS_URL: ${{ vars.VITE_ALERTS_URL }}
          VITE_INSTITUTIONAL_DOCUMENTS_URL: ${{ vars.VITE_INSTITUTIONAL_DOCUMENTS_URL }}
          VITE_PROJECTS_URL: ${{ vars.VITE_PROJECTS_URL }}
          VITE_WEEKLY_AGENDA_URL: ${{ vars.VITE_WEEKLY_AGENDA_URL }}
          VITE_SCHOOL_CALENDAR_URL: ${{ vars.VITE_SCHOOL_CALENDAR_URL }}
          VITE_GOOGLE_CALENDAR_API_KEY: ${{ vars.VITE_GOOGLE_CALENDAR_API_KEY }}
          VITE_GOOGLE_CALENDAR_ID: ${{ vars.VITE_GOOGLE_CALENDAR_ID }}
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  # Publica en un trabajo aparte, como en la plantilla oficial de GitHub Pages:
  # así el paquete ya está registrado cuando se intenta publicar.
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v5
