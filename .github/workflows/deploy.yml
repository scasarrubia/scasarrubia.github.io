name: Publicar sitio

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          VITE_NEWS_URL: ${{ vars.VITE_NEWS_URL }}
          VITE_ALERTS_URL: ${{ vars.VITE_ALERTS_URL }}
          VITE_INSTITUTIONAL_DOCUMENTS_URL: ${{ vars.VITE_INSTITUTIONAL_DOCUMENTS_URL }}
          VITE_PROJECTS_URL: ${{ vars.VITE_PROJECTS_URL }}
          VITE_WEEKLY_AGENDA_URL: ${{ vars.VITE_WEEKLY_AGENDA_URL }}
          VITE_SCHOOL_CALENDAR_URL: ${{ vars.VITE_SCHOOL_CALENDAR_URL }}
          VITE_GOOGLE_CALENDAR_API_KEY: ${{ vars.VITE_GOOGLE_CALENDAR_API_KEY }}
          VITE_GOOGLE_CALENDAR_ID: ${{ vars.VITE_GOOGLE_CALENDAR_ID }}
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist
      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v5
